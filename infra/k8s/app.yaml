apiVersion: v1
kind: Namespace
metadata:
  name: return-radar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: return-radar-api
  namespace: return-radar
spec:
  replicas: 1
  selector:
    matchLabels: { app: return-radar-api }
  template:
    metadata:
      labels: { app: return-radar-api }
    spec:
      containers:
        - name: api
          image: return-radar-api:dev
          imagePullPolicy: Never
          ports: [ { containerPort: 8000 } ]
          envFrom:
            - secretRef: { name: return-radar-env }
          resources:
            requests: { memory: 64Mi, cpu: 100m }
            limits: { memory: 128Mi }   # deliberately tight: the post-Diwali import OOMKills it (the incident)
          readinessProbe:
            httpGet: { path: /api/readyz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: 8000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: return-radar-api
  namespace: return-radar
spec:
  type: NodePort
  selector: { app: return-radar-api }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
